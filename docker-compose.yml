services:
  mailhog:
    image: mailhog/mailhog
    container_name: fastint_mailhog_directus
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
  api:
    build:
      context: .
      dockerfile: Dockerfile # check the name, can be case-sensitive
    container_name: fastint_api_directus
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MAIL_SERVER=mailhog
      - MAIL_PORT=1025
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DIRECTUS_BASE_URL=${DIRECTUS_BASE_URL}
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL}
    volumes:
      - .:/app # Mounting source code for live hot-reloading during development
    command: [ "uvicorn", "app.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    depends_on:
      mailhog:
        condition: service_started
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: fastint_db_directus
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Host port: Internal container port
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:11
    ports:
      - "8055:8055"
    env_file:
      - .env
    environment:
      # Required: Used to sign JWT tokens, encrypt session cookies, and secure hashes
      SECRET: ${SECRET_KEY}
      # Initial admin user credentials (used on first boot)
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      # PostgreSQL connection details
      DB_CLIENT: "pg"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Public-facing URL of the Directus instance
      PUBLIC_URL: "http://localhost:8055"
      WEBSOCKETS_ENABLED: "true"
    depends_on:
      - db
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
      POSTGRES_DB: keycloak
    ports:
      - "5435:5432" # exposing it just to view how the entire kc-db setup
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # DNS issue fix 
      KC_HOSTNAME: ${KC_HOSTNAME}

    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
  keycloak_pgdata:
