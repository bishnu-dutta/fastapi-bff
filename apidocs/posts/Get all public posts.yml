info:
  name: Get all public posts
  type: http
  seq: 2
  tags:
    - posts

http:
  method: GET
  url: "{{baseUrl}}/user/post/all-posts"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/user/post/all-posts"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 0,
              "title": "",
              "content": "",
              "user_id": 0,
              "created_at": ""
            }
          ]

