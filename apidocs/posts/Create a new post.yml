info:
  name: Create a new post
  type: http
  seq: 1
  tags:
    - posts

http:
  method: POST
  url: "{{baseUrl}}/user/post/create"
  body:
    type: json
    data: |-
      {
        "title": "max created a title",
        "content": "max writing content"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/user/post/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "",
            "content": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "title": "",
            "content": "",
            "user_id": 0,
            "created_at": "",
            "author": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/user/post/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "",
            "content": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: Create and saves a new post authored by the currently authenticated user
