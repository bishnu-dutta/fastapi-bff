info:
  name: Delete a post by id
  type: http
  seq: 6
  tags:
    - posts

http:
  method: DELETE
  url: "{{baseUrl}}/user/post/:id"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/user/post/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "title": "",
            "content": "",
            "user_id": 0,
            "created_at": "",
            "author": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/user/post/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

