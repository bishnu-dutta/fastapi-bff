info:
  name: Delete current user
  type: http
  seq: 4
  tags:
    - users

http:
  method: DELETE
  url: "{{baseUrl}}/users/delete"
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: req.body.access_token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/users/delete"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "username": "",
            "email": ""
          }

docs: Delete current user data from database(only the current authorised user can delete itself)
