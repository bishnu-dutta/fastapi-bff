info:
  name: Update current user
  type: http
  seq: 5
  tags:
    - users

http:
  method: PUT
  url: "{{baseUrl}}/users/update"
  body:
    type: json
    data: |-
      {
        "username": "max",
        "email": "max@gmail.com",
        "password": "max"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: req.body.access_token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/users/update"
      method: PUT
      body:
        type: json
        data: |-
          {
            "username": "",
            "email": "",
            "password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "username": "",
            "email": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/users/update"
      method: PUT
      body:
        type: json
        data: |-
          {
            "username": "",
            "email": "",
            "password": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: Update current user data from database(only the current authorised user can update itself)
