info:
  name: login to get token
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/token"
  body:
    type: form-urlencoded
    data:
      - name: username
        value: max
      - name: password
        value: max
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.access_token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
